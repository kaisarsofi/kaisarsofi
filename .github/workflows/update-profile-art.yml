name: Refresh contribution calendar

on:
  push:
    branches: [master]
    paths-ignore:
      - "assets/contributions.svg"
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-contribution-calendar
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Render the latest public contribution calendar
        run: python3 scripts/update_contributions.py

      - name: Commit the refreshed SVG when it changes
        run: |
          if git diff --quiet -- assets/contributions.svg; then
            echo "Contribution calendar is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.svg
          git commit -m "chore: refresh contribution calendar [skip ci]"
          git push
